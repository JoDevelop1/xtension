<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xtension timeline layout harness</title>
    <link rel="stylesheet" href="../src/content.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        background: #fff;
        color: rgb(15, 20, 25);
        font: 15px/20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 32px;
      }
      article {
        border: 1px solid rgb(239, 243, 244);
        padding: 12px 16px;
        width: 600px;
      }
      .tweet-header {
        align-items: flex-start;
        display: flex;
        width: 520px;
      }
      [data-testid="User-Name"] {
        align-items: center;
        display: flex;
        flex: 1 1 auto;
        height: 24px;
        width: auto;
      }
      .name-group {
        align-items: center;
        display: flex;
        min-width: 0;
      }
      .display-name {
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .verified {
        color: rgb(29, 155, 240);
        flex: 0 0 auto;
        margin-left: 2px;
      }
      .metadata {
        color: rgb(83, 100, 113);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .native-metadata-clip {
        overflow: hidden;
        width: 100%;
      }
      .tweet-actions {
        align-items: center;
        display: inline-flex;
        flex: 0 0 auto;
        height: 20px;
      }
      .tweet-actions button {
        background: transparent;
        border: 0;
        height: 20px;
        padding: 0 4px;
      }
      .post { margin: 4px 0 0; }
      .relationship-samples {
        align-items: center;
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .relationship-samples [data-xtension-following-badge] { margin-left: 0; }
      output { display: block; margin-top: 16px; white-space: pre; }
    </style>
  </head>
  <body>
    <article data-testid="tweet">
      <div class="tweet-header" data-xtension-reply-header-row="true">
        <div data-testid="User-Name" data-xtension-reply-name-row="true" data-xtension-reply-timestamp-placement="actions">
          <div class="name-group">
            <span class="display-name" data-layout="name">Docteur Laurent Alexandre</span>
            <span class="verified" aria-label="Compte certifié">●</span>
          </div>
          <span data-xtension-reply-host="name-row">
            <span data-xtension-following-badge="not-following" data-layout="badge">✕ Non abonné</span>
            <button type="button" data-xtension-reply-button="true" data-xtension-reply-label="Répondre" data-layout="reply"></button>
          </span>
          <div class="metadata" data-xtension-reply-metadata="true" data-layout="metadata"><div class="native-metadata-clip"><a href="/dr_l_alexandre" data-xtension-reply-handle="true" data-layout="handle">@dr_l_alexandre</a><span data-xtension-reply-separator="true">·</span><a href="/dr_l_alexandre/status/1" data-xtension-reply-timestamp="true" data-layout="native-timestamp"><time datetime="2026-08-14T10:00:00Z">2 h</time></a></div></div>
        </div>
        <a href="/dr_l_alexandre/status/1" data-xtension-reply-timestamp-proxy="true" data-xtension-reply-timestamp-placement="actions" data-layout="timestamp"><time datetime="2026-08-14T10:00:00Z">2 h</time></a>
        <div class="tweet-actions" data-layout="actions"><button type="button" aria-label="Grok">◒</button><button type="button" data-testid="caret" aria-label="Plus">•••</button></div>
      </div>
      <p class="post">Cette strat est en train de tout changer en ecom 🤯</p>
    </article>
    <div class="relationship-samples" aria-label="États de relation Xtension">
      <span data-xtension-following-badge="not-following">✕ Non abonné</span>
      <span data-xtension-following-badge="following">✓ Abonné</span>
      <span data-xtension-following-badge="mutual">↔ Mutuel</span>
    </div>
    <output id="result"></output>
    <script>
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const elements = Object.fromEntries(
          ["name", "badge", "reply", "metadata", "handle", "timestamp", "native-timestamp", "actions"].map((key) => [key, document.querySelector(`[data-layout="${key}"]`)])
        );
        const topRowElements = Object.fromEntries(
          ["name", "badge", "reply", "timestamp"].map((key) => [key, elements[key]])
        );
        const rects = Object.fromEntries(
          Object.entries(elements).map(([key, element]) => [key, element.getBoundingClientRect()])
        );
        const centers = Object.fromEntries(
          Object.entries(topRowElements).map(([key]) => {
            const rect = rects[key];
            return [key, Math.round((rect.top + rect.bottom) * 10) / 20];
          })
        );
        const spread = Math.max(...Object.values(centers)) - Math.min(...Object.values(centers));
        const metadataBelow = rects.handle.top >= Math.max(rects.name.bottom, rects.badge.bottom, rects.reply.bottom) - 0.5;
        const handleFlushLeft = Math.abs(rects.handle.left - rects.name.left) <= 0.5;
        const timestampAdjacentToActions = rects.timestamp.right <= rects.actions.left
          && rects.actions.left - rects.timestamp.right <= 4.5;
        const nativeTimestampHidden = getComputedStyle(elements["native-timestamp"]).display === "none";
        const colors = {
          badge: getComputedStyle(elements.badge).color,
          reply: getComputedStyle(elements.reply).backgroundColor,
          handle: getComputedStyle(elements.handle).color,
          timestamp: getComputedStyle(elements.timestamp).color
        };
        const relationshipColors = Object.fromEntries(
          ["not-following", "following", "mutual"].map((state) => [
            state,
            getComputedStyle(document.querySelector(`.relationship-samples [data-xtension-following-badge="${state}"]`)).color
          ])
        );
        const result = { centers, spread, topRowAligned: spread <= 2, metadataBelow, handleFlushLeft, timestampAdjacentToActions, nativeTimestampHidden, colors, relationshipColors };
        result.aligned = result.topRowAligned && result.metadataBelow && result.handleFlushLeft && result.timestampAdjacentToActions && result.nativeTimestampHidden;
        document.body.setAttribute("data-layout-aligned", String(result.aligned));
        document.getElementById("result").textContent = JSON.stringify(result);
        document.title = `Xtension timeline layout: ${result.aligned ? "PASS" : "FAIL"}`;
      }));
    </script>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xtension timeline layout harness</title>
    <link rel="stylesheet" href="../src/content.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        background: #fff;
        color: rgb(15, 20, 25);
        font: 15px/20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 32px;
      }
      article {
        border: 1px solid rgb(239, 243, 244);
        padding: 12px 16px;
        width: 600px;
      }
      [data-testid="User-Name"] {
        align-items: center;
        display: flex;
        height: 24px;
        width: 520px;
      }
      .name-group {
        align-items: center;
        display: flex;
        min-width: 0;
      }
      .display-name {
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .verified {
        color: rgb(29, 155, 240);
        flex: 0 0 auto;
        margin-left: 2px;
      }
      .metadata {
        color: rgb(83, 100, 113);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .post { margin: 4px 0 0; }
      output { display: block; margin-top: 16px; white-space: pre; }
    </style>
  </head>
  <body>
    <article data-testid="tweet">
      <div data-testid="User-Name" data-xtension-reply-name-row="true">
        <div class="name-group">
          <span class="display-name" data-layout="name">Docteur Laurent Alexandre</span>
          <span class="verified" aria-label="Compte certifié">●</span>
        </div>
        <span data-xtension-reply-host="name-row">
          <span data-xtension-following-badge="not-following" data-layout="badge">✕ Abonné</span>
          <button type="button" data-xtension-reply-button="true" data-xtension-reply-label="Répondre" data-layout="reply"></button>
        </span>
        <div class="metadata" data-xtension-reply-metadata="true" data-layout="metadata"><a href="/dr_l_alexandre" data-xtension-reply-handle="true" data-layout="handle">@dr_l_alexandre</a><span data-xtension-reply-separator="true">·</span><a href="/dr_l_alexandre/status/1" data-xtension-reply-timestamp="true" data-layout="timestamp"><time datetime="2026-08-14T10:00:00Z">2 h</time></a></div>
      </div>
      <p class="post">Cette strat est en train de tout changer en ecom 🤯</p>
    </article>
    <output id="result"></output>
    <script>
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const elements = Object.fromEntries(
          ["name", "badge", "reply", "metadata", "handle", "timestamp"].map((key) => [key, document.querySelector(`[data-layout="${key}"]`)])
        );
        const topRowElements = Object.fromEntries(
          ["name", "badge", "reply", "timestamp"].map((key) => [key, elements[key]])
        );
        const rects = Object.fromEntries(
          Object.entries(elements).map(([key, element]) => [key, element.getBoundingClientRect()])
        );
        const centers = Object.fromEntries(
          Object.entries(topRowElements).map(([key]) => {
            const rect = rects[key];
            return [key, Math.round((rect.top + rect.bottom) * 10) / 20];
          })
        );
        const spread = Math.max(...Object.values(centers)) - Math.min(...Object.values(centers));
        const metadataBelow = rects.handle.top >= Math.max(rects.name.bottom, rects.badge.bottom, rects.reply.bottom) - 0.5;
        const handleFlushLeft = Math.abs(rects.handle.left - rects.name.left) <= 0.5;
        const rowRect = document.querySelector('[data-xtension-reply-name-row="true"]').getBoundingClientRect();
        const timestampFlushRight = Math.abs(rects.timestamp.right - rowRect.right) <= 0.5;
        const colors = {
          badge: getComputedStyle(elements.badge).color,
          reply: getComputedStyle(elements.reply).backgroundColor,
          handle: getComputedStyle(elements.handle).color,
          timestamp: getComputedStyle(elements.timestamp).color
        };
        const result = { centers, spread, topRowAligned: spread <= 2, metadataBelow, handleFlushLeft, timestampFlushRight, colors };
        result.aligned = result.topRowAligned && result.metadataBelow && result.handleFlushLeft && result.timestampFlushRight;
        document.body.setAttribute("data-layout-aligned", String(result.aligned));
        document.getElementById("result").textContent = JSON.stringify(result);
        document.title = `Xtension timeline layout: ${result.aligned ? "PASS" : "FAIL"}`;
      }));
    </script>
  </body>
</html>
